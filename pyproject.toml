[project]
name = "turnecho"
version = "0.1.0"
description = "Codex plugin that reads completed agent responses out loud"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kittentts",
    "pydantic>=2.13.4",
    "sounddevice>=0.5.5",
]

[project.scripts]
turnecho-hook = "turnecho.hook:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["turnecho"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.sources]
kittentts = { url = "https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl" }
