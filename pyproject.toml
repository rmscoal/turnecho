[project]
name = "turnecho"
version = "1.0.0"
description = "Codex plugin that reads agent summaries out loud"
readme = "README.md"
requires-python = ">=3.13"
# No unconditional dependencies: the installer, CLI, hooks, and worker
# orchestration are stdlib-only so `uvx --from <tag|path>` never resolves
# the heavy TTS graph. Audio ships in the `audio` extra, installed into
# versioned runtimes from the committed lockfile.
dependencies = []

[project.optional-dependencies]
audio = [
    "kittentts",
    "sounddevice>=0.5.5",
    # First release with cp313 wheels; older versions fail to build on 3.13.
    "curated-tokenizers>=0.0.10",
    # KittenTTS and misaki require unpinned `spacy`, which otherwise resolves
    # to 2.0.17 (unbuildable on 3.13) or a 4.0 prerelease (thinc 9). 3.8.7 is
    # the first 3.8 release with cp313 wheels; <4 keeps the thinc 8 line.
    "spacy>=3.8.7,<4",
]

[project.scripts]
turnecho = "turnecho.cli:main"
turnecho-hook = "turnecho.stop_hook:main"
turnecho-install = "turnecho.install_plugin:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["turnecho"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.sources]
kittentts = { url = "https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl" }
